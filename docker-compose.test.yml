services:
  seed-db:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: rmt_test_root
      MYSQL_DATABASE: rmt_seed_test
      MYSQL_USER: rmt_test
      MYSQL_PASSWORD: rmt_test
      RMT_SEED_PROFILE: ${RMT_SEED_PROFILE:-example}
      RMT_LOCAL_SEED_FILE: ${RMT_LOCAL_SEED_FILE:-/opt/rmt-local-seed.sql}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/reference.sql:/docker-entrypoint-initdb.d/02-reference.sql:ro
      - ./database/session_handler.sql:/docker-entrypoint-initdb.d/03-session-handler.sql:ro
      - ./database/seed-profile.sh:/docker-entrypoint-initdb.d/04-seed-profile.sh:ro
      - ./database:/opt/rmt-seeds:ro
      - ./tests/fixtures/local-seed.sql:/opt/rmt-local-seed.sql:ro

  test-db:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: rmt_test_root
      MYSQL_DATABASE: rmt_test
      MYSQL_USER: rmt_test
      MYSQL_PASSWORD: rmt_test
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/reference.sql:/docker-entrypoint-initdb.d/02-reference.sql:ro
      - ./database/session_handler.sql:/docker-entrypoint-initdb.d/03-session-handler.sql:ro
      - ./tests/fixtures/intake-hierarchy.sql:/docker-entrypoint-initdb.d/04-intake-hierarchy.sql:ro
      - ./database:/opt/rmt-seeds:ro

  test-runner:
    build: .
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      APP_ENV: testing
      DB_HOST: test-db
      DB_PORT: 3306
      DB_USER: rmt_test
      DB_PASS: rmt_test
      DB_NAME: rmt_test
      TZ: America/New_York
      CORS_ALLOWED_ORIGINS: ""
    volumes:
      - ./app:/var/www/html:ro
      - ./tests:/var/www/tests:ro
    entrypoint: ["php", "/var/www/tests/Integration/RequestWorkflowTest.php"]
